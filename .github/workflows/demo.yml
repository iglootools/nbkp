name: demo

on:
  push:
    tags:
      - 'v*'
    # branches:
    #   - main
  # Tags created by a workflow using GITHUB_TOKEN do not trigger other workflows,
  # so we use workflow_run to run the demo after the release workflow creates a tag.
  workflow_run:
    workflows: ["release"]
    types:
      - completed
  # Manually trigger the workflow using
  # gh workflow run demo.yml # --ref <branch>
  # gh run list --workflow demo.yml # --branch <branch>
  workflow_dispatch:
  repository_dispatch:
  # pull_request:

concurrency:
  # On main/release, we don't want any jobs cancelled so the sha is used to name the group
  # On PR branches, we cancel the job if new commits are pushed
  # More info: https://stackoverflow.com/a/68422069/253468
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release' ) && format('{0}-main-{1}', github.workflow, github.sha) || format('{0}-main-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

env:
  MISE_EXPERIMENTAL: true

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      # Install the mise binary only, then install tools explicitly. mise-action's
      # default `mise install` auto-adds `--locked` when a mise.lock is present, and
      # that fails for tools the lockfile cannot carry URLs for — poetry uses the
      # vfox backend, which `mise lock` always skips. Same reason as in
      # renovate-mise-lock.yml.
      - uses: jdx/mise-action@v4
        with:
          install: false
      - run: mise install
      - name: Install pv (required by demo-magic)
        run: sudo apt-get update && sudo apt-get install -y pv
      - name: Record demo
        run: mise run ci-demo-record
      # CI records the demo but does not publish it: GitHub-hosted runners cannot
      # reach asciinema.org over either address family. IPv6 has no route, and the
      # single A record (109.107.37.0) times out at the TCP level even when pinned
      # in /etc/hosts, while the same address answers HTTP 200 from outside CI — so
      # the block sits between the runners and that host, and nothing here can route
      # around it. Attempting the upload anyway cost ~136 s of SYN retries and then
      # failed the workflow after an otherwise successful release.
      #
      # Recording still runs: it exercises demo.sh and record-demo.sh on every
      # release. To publish, download the artifact and run `mise run demo-upload`
      # from a machine that has a route to asciinema.org.
      - name: Upload demo artifacts
        uses: actions/upload-artifact@v4
        with:
          name: demo-recording
          path: |
            demo/demo.cast
            demo/demo.gif
          if-no-files-found: error
          retention-days: 90
