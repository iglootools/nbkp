name: demo

on:
  push:
    tags:
      - 'v*'
    # branches:
    #   - main
  # Tags created by a workflow using GITHUB_TOKEN do not trigger other workflows,
  # so we use workflow_run to run the demo after the release workflow creates a tag.
  workflow_run:
    workflows: ["release"]
    types:
      - completed
  # Manually trigger the workflow using
  # gh workflow run demo.yml # --ref <branch>
  # gh run list --workflow demo.yml # --branch <branch>
  workflow_dispatch:
  repository_dispatch:
  # pull_request:

concurrency:
  # On main the group carries the commit sha, so every push gets a group of its own and
  # nothing is cancelled. Everywhere else — pull requests, tags, dispatches — the group is
  # the ref, so pushing again cancels the run still in flight for that ref.
  # More info: https://stackoverflow.com/a/68422069/253468
  #
  # head_sha is tried before github.sha for the sake of `workflow_run`: for that event GitHub
  # sets GITHUB_REF to the default branch and GITHUB_SHA to the *last commit on the default
  # branch*, not to the commit that triggered the run. Grouping on github.sha would therefore
  # drop every workflow_run-triggered run into one group for as long as the default branch
  # head does not move, and cancel-in-progress would kill the run already going. The term is
  # inert in workflows without a workflow_run trigger, which is why the expression is kept
  # identical across all of them.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && format('main-{0}', github.event.workflow_run.head_sha || github.sha) || github.ref }}
  cancel-in-progress: true

env:
  MISE_EXPERIMENTAL: true
  HAS_ASCIINEMA_INSTALL_ID: ${{ secrets.ASCIINEMA_INSTALL_ID != '' }}

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Checkout only: upload-artifact authenticates with the runner's own token, not
    # GITHUB_TOKEN. Declared so the job does not inherit the repository's read-write default.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.7
      - name: Install pv (required by demo-magic)
        run: sudo apt-get update && sudo apt-get install -y pv
      - name: Record demo
        run: mise run ci-demo-record
      # Keep the recording downloadable: publishing from CI is disabled below.
      # Also on failure: the cast is the only record of what went wrong inside the
      # recorded session. demo-upload-latest only publishes from successful runs.
      - name: Upload demo artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: demo-recording
          # Only the cast: the agg/GIF conversion in record-demo.sh is commented out,
          # so demo/demo.gif is not produced. Add it back here when that is re-enabled.
          path: demo/demo.cast
          if-no-files-found: error
          retention-days: 90

      # ---------------------------------------------------------------------------
      # Publishing to asciinema.org is disabled: GitHub-hosted runners cannot reach
      # that host over either address family. IPv6 has no route, and the single A
      # record (109.107.37.0) times out at the TCP level even when pinned in
      # /etc/hosts to take DNS out of the picture — while the same address answers
      # HTTP 200 from outside CI. Each attempt burned ~136 s of SYN retries (the
      # kernel's default budget) and then failed the workflow after an otherwise
      # successful release.
      #
      # To publish: run
      #   mise run demo-upload-latest
      # from a machine that has a route to asciinema.org — it downloads the
      # demo-recording artifact from the newest successful run and uploads it.
      #
      # To re-enable here: uncomment both steps below. secrets.ASCIINEMA_INSTALL_ID
      # and the HAS_ASCIINEMA_INSTALL_ID env above are still wired up for them.
      # ---------------------------------------------------------------------------
      # - name: Set up asciinema install ID
      #   if: env.HAS_ASCIINEMA_INSTALL_ID == 'true'
      #   env:
      #     ASCIINEMA_INSTALL_ID: ${{ secrets.ASCIINEMA_INSTALL_ID }}
      #   run: |
      #     mkdir -p "$HOME/.local/state/asciinema"
      #     echo "$ASCIINEMA_INSTALL_ID" > "$HOME/.local/state/asciinema/install-id"
      # - name: Upload demo
      #   # Trigger on release workflow runs or on tag pushes
      #   if: >-
      #     startsWith(github.ref, 'refs/tags/')
      #     || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      #     || github.event_name == 'workflow_dispatch'
      #     || github.event_name == 'repository_dispatch'
