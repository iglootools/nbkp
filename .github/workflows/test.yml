name: test

on:
  # Manually trigger the workflow using
  # gh workflow run test.yml # --ref <branch>
  # gh run list --workflow test.yml # --branch <branch>
  workflow_dispatch:
  repository_dispatch:
  pull_request:
  push:
    tags:
      - "*"
    branches:
      - "main"

concurrency:
  # On main the group carries the commit sha, so every push gets a group of its own and
  # nothing is cancelled. Everywhere else — pull requests, tags, dispatches — the group is
  # the ref, so pushing again cancels the run still in flight for that ref.
  # More info: https://stackoverflow.com/a/68422069/253468
  #
  # head_sha is tried before github.sha for the sake of `workflow_run`: for that event GitHub
  # sets GITHUB_REF to the default branch and GITHUB_SHA to the *last commit on the default
  # branch*, not to the commit that triggered the run. Grouping on github.sha would therefore
  # drop every workflow_run-triggered run into one group for as long as the default branch
  # head does not move, and cancel-in-progress would kill the run already going. The term is
  # inert in workflows without a workflow_run trigger, which is why the expression is kept
  # identical across all of them.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && format('main-{0}', github.event.workflow_run.head_sha || github.sha) || github.ref }}
  cancel-in-progress: true

env:
  MISE_EXPERIMENTAL: true
  # Assert that syncing will not change uv.lock, so a stale lockfile fails the build instead
  # of being papered over by an implicit re-resolve. Set as an environment variable rather
  # than a --locked flag so the [deps.uv] command in mise.toml stays identical to local runs
  # and only the strictness differs.
  UV_LOCKED: 1

jobs:
  # Three jobs in parallel, one per ci-* task, so the two minute-long Docker suites do not
  # wait for each other. The `test` job at the end gathers them under the one check name
  # the main ruleset requires.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Checkout only. Declared so the job does not inherit the repository's read-write default.
    permissions:
      contents: read
    # No Python matrix: the supported floor is the version pinned in mise.toml, so the one
    # interpreter worth testing is the one the locked install below already provides.
    # See common/guidelines/coding/python.md "Python Version Policy".
    steps: &steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # graphviz not available on mise
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y graphviz
      # Locked install of the committed pins: every tool is on a backend that `mise lock` can
      # record per-platform URLs and checksums for, so the action's default
      # `mise install --locked` works.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.24
      # pyyaml publishes no wheel for the pinned Python yet, so every run built it from
      # source (about 5s). `uv cache prune --ci` below keeps exactly such locally built
      # wheels and drops the downloaded ones, which are faster to fetch again than to
      # restore. Retire the cache when every dependency ships wheels for the pin.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      # Each job is named after its task: check runs ci-check, test-docker ci-test-docker.
      - run: mise run ci-${{ github.job }}
      - run: uv cache prune --ci

  test-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Checkout only. Declared so the job does not inherit the repository's read-write default.
    permissions:
      contents: read
    steps: *steps

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Checkout only. Declared so the job does not inherit the repository's read-write default.
    permissions:
      contents: read
    steps: *steps

  test:
    # The main ruleset requires a check named "test". A job skipped because a dependency
    # failed would count as passing, so this one always runs and fails unless all three did.
    if: always()
    needs: [check, test-docker, test-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: '[ "$RESULTS" = "success success success" ]'
