name: test

on:
  # Manually trigger the workflow using
  # gh workflow run test.yml # --ref <branch>
  # gh run list --workflow test.yml # --branch <branch>
  workflow_dispatch:
  repository_dispatch:
  pull_request:
  push:
    tags:
      - "*"
    branches:
      - "main"

concurrency:
  # On main the group carries the commit sha, so every push gets a group of its own and
  # nothing is cancelled. Everywhere else — pull requests, tags, dispatches — the group is
  # the ref, so pushing again cancels the run still in flight for that ref.
  # More info: https://stackoverflow.com/a/68422069/253468
  #
  # head_sha is tried before github.sha for the sake of `workflow_run`: for that event GitHub
  # sets GITHUB_REF to the default branch and GITHUB_SHA to the *last commit on the default
  # branch*, not to the commit that triggered the run. Grouping on github.sha would therefore
  # drop every workflow_run-triggered run into one group for as long as the default branch
  # head does not move, and cancel-in-progress would kill the run already going. The term is
  # inert in workflows without a workflow_run trigger, which is why the expression is kept
  # identical across all of them.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && format('main-{0}', github.event.workflow_run.head_sha || github.sha) || github.ref }}
  cancel-in-progress: true

env:
  MISE_EXPERIMENTAL: true
  # Assert that syncing will not change uv.lock, so a stale lockfile fails the build
  # instead of being papered over by an implicit re-resolve. Set as an environment
  # variable rather than a --locked flag so the [deps.uv] command in mise.toml stays
  # identical to local runs and only the strictness differs.
  UV_LOCKED: 1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      max-parallel: 2
      matrix:
        python-version: [
          "3.12.13", 
          # Let's disable 3.14 in CI for now to save on CI minutes. 
          # "3.14.3"
        ]
    name: test (python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      # graphviz not available on mise
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y graphviz
      # Locked install of the committed pins first: every tool is now on a backend that
      # `mise lock` can record per-platform URLs and checksums for, so the action's default
      # `mise install --locked` works. It must come BEFORE the matrix override below, since
      # `mise use` writes a python version that is deliberately not in mise.lock.
      - uses: jdx/mise-action@v4
      - run: mise use python@${{ matrix.python-version }}
      # Unlocked on purpose: the matrix python version is not in mise.lock.
      - run: mise install
      - run: mise run ci-test