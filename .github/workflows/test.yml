name: test

on:
  # Manually trigger the workflow using
  # gh workflow run test.yml # --ref <branch>
  # gh run list --workflow test.yml # --branch <branch>
  workflow_dispatch:
  repository_dispatch:
  pull_request:
  push:
    tags:
      - "*"
    branches:
      - "main"

concurrency:
  # On main/release, we don't want any jobs cancelled so the sha is used to name the group
  # On PR branches, we cancel the job if new commits are pushed
  # More info: https://stackoverflow.com/a/68422069/253468
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release' ) && format('{0}-main-{1}', github.workflow, github.sha) || format('{0}-main-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

env:
  MISE_EXPERIMENTAL: true
  # Assert that syncing will not change uv.lock, so a stale lockfile fails the build
  # instead of being papered over by an implicit re-resolve. Set as an environment
  # variable rather than a --locked flag so the [deps.uv] command in mise.toml stays
  # identical to local runs and only the strictness differs.
  UV_LOCKED: 1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      max-parallel: 2
      matrix:
        python-version: [
          "3.12.13", 
          # Let's disable 3.14 in CI for now to save on CI minutes. 
          # "3.14.3"
        ]
    name: test (python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      # graphviz not available on mise
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y graphviz
      # Locked install of the committed pins first: every tool is now on a backend that
      # `mise lock` can record per-platform URLs and checksums for, so the action's default
      # `mise install --locked` works. It must come BEFORE the matrix override below, since
      # `mise use` writes a python version that is deliberately not in mise.lock.
      - uses: jdx/mise-action@v4
      - run: mise use python@${{ matrix.python-version }}
      # Unlocked on purpose: the matrix python version is not in mise.lock.
      - run: mise install
      - run: mise run ci-test