name: publish-test

# This workflow is used to test the publish workflow without actually publishing to PyPI.

# Differences with the publish workflow:
# - It is triggered manually instead of being triggered by the release workflow and/or tags.
# - It publishes to https://test.pypi.org/ instead of https://pypi.org/,
#   which is a separate instance of the Python Package Index that allows trying distribution tools and processes without affecting the real index
# - It enables verbose: true in the pypa/gh-action-pypi-publish action to get more detailed logs for debugging
# - It derives the version from the latest tag and adds a .devYYYYMMDDHHMMSS suffix (iglootools python dev-version) to avoid version clashes on repeated publishes to Test PyPI, whereas the publish workflow relies on the tag name for the version and thus does not need a timestamp suffix
#
# Also keep in mind that OIDC authentication does not work with shared workflows,
# so the code essentially needs to be duplicated in the `publish.yml` and `publish-test.yml` workflows.

on:
  # The workflow is usually triggered when the release workflow completes, but it can also be re-triggered manually if needed using
  # gh workflow run publish-test.yml --ref <tag>
  # gh run list --workflow publish-test.yml
  workflow_dispatch:
  repository_dispatch:

concurrency:
  # Deliberately unlike preflight.yml: this workflow mutates state outside the repository and is
  # neither idempotent nor reversible, so it must never be cancelled part-way through. A
  # second run queues behind the one in flight instead of killing it.
  #
  # The key is the workflow name alone, with no ref or sha, so that two runs can never
  # overlap even when they carry different refs — a manual `gh workflow run` and an automatic
  # trigger can both aim at the same version, and a half-finished or doubled release costs far
  # more than a short wait. GitHub keeps at most one run pending per group, so a third arrival
  # supersedes the *pending* run, never the running one.
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  MISE_EXPERIMENTAL: true
  # Fail on a stale uv.lock instead of silently re-resolving on the runner.
  UV_LOCKED: 1

jobs:
  pypi-publish:
    name: Upload release to Test PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      # cosmetic URL displayed in the GitHub UI for the environment,
      # not to be confused with the repository-url used by the pypa/gh-action-pypi-publish action,
      # which is the actual URL of the repository where the package is published
      url: https://test.pypi.org/p/nbkp/
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
      contents: read # checkout; a permissions block sets every scope it omits to none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.11.12
      # A throwaway version, <last release>.dev<UTC time>, since Test PyPI refuses one it has
      # seen; why it starts from the base release is in the command's module,
      # iglootools.python.devversion. UV_DYNAMIC_VERSIONING_BYPASS is consulted before any VCS
      # lookup, so it wins unconditionally. Assigned first: a failure inside `echo "$(…)"`
      # would not fail the step.
      - name: Resolve PyPI-compatible version
        run: |
          version=$(uv run iglootools python dev-version)
          echo "UV_DYNAMIC_VERSIONING_BYPASS=$version" >> "$GITHUB_ENV"
      - run: mise run ci-build
      - name: Publish package distributions to Test PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
