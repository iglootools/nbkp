name: publish-test

# This workflow is used to test the publish workflow without actually publishing to PyPI.

# Differences with the publish workflow:
# - It is triggered manually instead of being triggered by the release workflow and/or tags.
# - It publishes to https://test.pypi.org/ instead of https://pypi.org/,
#   which is a separate instance of the Python Package Index that allows trying distribution tools and processes without affecting the real index
# - It enables verbose: true in the pypa/gh-action-pypi-publish action to get more detailed logs for debugging
# - It derives the version from the latest tag and adds a .devYYYYMMDDHHMMSS suffix to avoid version clashes on repeated publishes to Test PyPI, whereas the publish workflow relies on the tag name for the version and thus does not need a timestamp suffix
#
# Also keep in mind that OIDC authentication does not work with shared workflows,
# so the code essentially needs to be duplicated in the `publish.yml` and `publish-test.yml` workflows.

on:
  # The workflow is usually triggered when the release workflow completes, but it can also be re-triggered manually if needed using
  # gh workflow run publish-test.yml --ref <tag>
  # gh run list --workflow publish-test.yml
  workflow_dispatch:
  repository_dispatch:

env:
  MISE_EXPERIMENTAL: true
  # Fail on a stale uv.lock instead of silently re-resolving on the runner.
  UV_LOCKED: 1

jobs:
  pypi-publish:
    name: Upload release to Test PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      # cosmetic URL displayed in the GitHub UI for the environment,
      # not to be confused with the repository-url used by the pypa/gh-action-pypi-publish action,
      # which is the actual URL of the repository where the package is published
      url: https://test.pypi.org/p/nbkp/
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true
    - uses: jdx/mise-action@v4
    - name: Resolve PyPI-compatible version
      # Derive the dev version from the base *release* version in the tag, not from the full
      # VCS-derived version. The previous implementation did
      #   raw=$(poetry version --short); clean=${raw%%+*}
      # and appended `.dev<ts>`, which on any non-tag ref produced something like
      # 0.2.1.post5.dev0.dev20260812103000 — two dev segments, which is invalid PEP 440.
      # It only worked because the workflow is normally dispatched from a tag.
      #
      # Reading the tag directly also avoids needing the build backend just to ask it a
      # question. UV_DYNAMIC_VERSIONING_BYPASS is consulted before any VCS lookup, so it
      # wins unconditionally.
      run: |
        base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null | sed 's/^v//' || echo 0.0.0)
        ts=$(date -u +%Y%m%d%H%M%S)
        echo "UV_DYNAMIC_VERSIONING_BYPASS=${base}.dev${ts}" >> "$GITHUB_ENV"
    - run: mise run ci-build
    - name: Publish package distributions to Test PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        verbose: true
