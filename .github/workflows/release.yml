name: release
on:
  # Manually trigger the workflow using
  # gh workflow run release.yml # --ref <branch>
  # gh run list --workflow release.yml
  workflow_dispatch:
  repository_dispatch:
  # push:
  #   branches:
  #     - main

concurrency:
  # Deliberately unlike test.yml: this workflow mutates state outside the repository and is
  # neither idempotent nor reversible, so it must never be cancelled part-way through. A
  # second run queues behind the one in flight instead of killing it.
  #
  # The key is the workflow name alone, with no ref or sha, so that two runs can never
  # overlap even when they carry different refs — a manual `gh workflow run` and an automatic
  # trigger can both aim at the same version, and a half-finished or doubled release costs far
  # more than a short wait. GitHub keeps at most one run pending per group, so a third arrival
  # supersedes the *pending* run, never the running one.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history + tags required for mathieudutour/github-tag-action
          # to find the previous tag and generate the changelog from commits
          fetch-depth: 0
          fetch-tags: true
      - name: Bump version and push tag
        id: tag-version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fetch_all_tags: true
      - name: Create a GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: ${{ steps.tag-version.outputs.new_tag }}
          name: ${{ steps.tag-version.outputs.new_tag }}
          body: ${{ steps.tag-version.outputs.changelog }}