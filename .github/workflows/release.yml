name: release
on:
  # Manually trigger the workflow using
  # gh workflow run release.yml # --ref <branch>
  # gh run list --workflow release.yml
  workflow_dispatch:
  repository_dispatch:

concurrency:
  # Deliberately unlike preflight.yml: this workflow mutates state outside the repository and is
  # neither idempotent nor reversible, so it must never be cancelled part-way through. A
  # second run queues behind the one in flight instead of killing it.
  #
  # The key is the workflow name alone, with no ref or sha, so that two runs can never
  # overlap even when they carry different refs — a manual `gh workflow run` and an automatic
  # trigger can both aim at the same version, and a half-finished or doubled release costs far
  # more than a short wait. GitHub keeps at most one run pending per group, so a third arrival
  # supersedes the *pending* run, never the running one.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      # Must be granted here: `permissions` in the called workflow is a ceiling on what the
      # caller allowed, not a grant. github-tag-action pushes the tag, release-action creates
      # the GitHub release.
      contents: write
    # The job lives in iglootools/common (guidelines/project-setup/shared-workflows.md). Keep
    # this workflow named `release`: publish.yml and demo.yml start on its completion.
    # Rehearse a change with `with: dry-run: true`, which pushes nothing.
    uses: iglootools/common/.github/workflows/reusable-release.yml@7387f04ab97bfba4f42bd2faeb77865acb40d7d2 # v1.33.0
