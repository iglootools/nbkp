name: check-links

on:
  # Manually trigger the workflow using
  # gh workflow run check-links.yml # --ref <branch>
  # gh run list --workflow check-links.yml # --branch <branch>
  workflow_dispatch:
  repository_dispatch:
  schedule:
    - cron: "00 18 * * 1"

concurrency:
  # A link check only reads and reports, so a run in flight can be abandoned and redone. This
  # stays here rather than moving into the shared workflow because concurrency governs the run
  # these triggers create. See the concurrency section of project-setup.md in iglootools/common.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && format('main-{0}', github.event.workflow_run.head_sha || github.sha) || github.ref }}
  cancel-in-progress: true

jobs:
  check-links:
    permissions:
      # Both must be granted here. `permissions` in the called workflow is a ceiling on what the
      # caller allowed, not a grant of its own, and declaring any permission zeroes the ones
      # left out — so dropping either breaks the shared job rather than tightening it.
      # This repository is public, so the clone would survive without contents: read via
      # checkout's anonymous fallback. Declared anyway: the shared job requires it, and a
      # repository that later goes private would otherwise start failing at checkout.
      contents: read # actions/checkout
      issues: write # filing the report issue
    # The job itself lives in iglootools/common so a fix reaches every project at once. The
    # hosts this repository excludes stay in its own .lycheeignore, which the shared job reads
    # because checkout there resolves to the calling repository. Pinned to a commit SHA for the
    # reason project-setup.md gives for actions, with the version in the trailing comment so
    # Renovate can raise the update.
    uses: iglootools/common/.github/workflows/reusable-check-links.yml@ee91113343a1e16568c1ffb6a70311673498087f # v1.6.0
