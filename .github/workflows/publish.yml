name: publish

# Test this workflow by making similar changes to `publish-test.yml` and triggering it manually
#
# OIDC authentication does not work with shared workflows,
# so the code essentially needs to be duplicated in the `publish.yml` and `publish-test.yml` workflows.

on:
  push:
    tags:
      - 'v*'
  # Tags created by a workflow using GITHUB_TOKEN do not trigger other workflows,
  # so we use workflow_run to publish after the release workflow creates a tag.
  workflow_run:
    workflows: ["release"]
    types:
      - completed
  # The workflow is usually triggered when the release workflow completes, but it can also be re-triggered manually if needed using
  # gh workflow run publish.yml --ref <tag>
  # gh run list --workflow publish.yml
  workflow_dispatch:
  repository_dispatch:

concurrency:
  # Deliberately unlike test.yml: this workflow mutates state outside the repository and is
  # neither idempotent nor reversible, so it must never be cancelled part-way through. A
  # second run queues behind the one in flight instead of killing it.
  #
  # The key is the workflow name alone, with no ref or sha, so that two runs can never
  # overlap even when they carry different refs — a manual `gh workflow run` and an automatic
  # trigger can both aim at the same version, and a half-finished or doubled release costs far
  # more than a short wait. GitHub keeps at most one run pending per group, so a third arrival
  # supersedes the *pending* run, never the running one.
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  MISE_EXPERIMENTAL: true
  # Fail on a stale uv.lock instead of silently re-resolving on the runner.
  UV_LOCKED: 1

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # workflow_run fires on both success and failure; skip if the release workflow failed.
    # For all other triggers (push, workflow_dispatch, repository_dispatch), always run.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      || github.event_name != 'workflow_run'
    environment:
      name: pypi
      # cosmetic URL displayed in the GitHub UI for the environment,
      # not to be confused with the repository-url used by the pypa/gh-action-pypi-publish action,
      # which is the actual URL of the repository where the package is published
      url: https://pypi.org/p/nbkp/
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}
        fetch-depth: 0
        fetch-tags: true
    - uses: jdx/mise-action@v4
    - run: mise run ci-build
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
