name: publish

# Test this workflow by making similar changes to `publish-test.yml` and triggering it manually
#
# OIDC authentication does not work with shared workflows,
# so the code essentially needs to be duplicated in the `publish.yml` and `publish-test.yml` workflows.

on:
  push:
    tags:
      - "v*"
  # Tags created by a workflow using GITHUB_TOKEN do not trigger other workflows,
  # so we use workflow_run to publish after the release workflow creates a tag.
  workflow_run:
    workflows: ["release"]
    types:
      - completed
  # The workflow is usually triggered when the release workflow completes, but it can also be re-triggered manually if needed using
  # gh workflow run publish.yml -f tag=<tag>   (or --ref <tag>)
  # gh run list --workflow publish.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, such as v1.2.0. Defaults to the v* tag on the dispatched commit.
        type: string
        required: false
  repository_dispatch:

concurrency:
  # Deliberately unlike preflight.yml: this workflow mutates state outside the repository and is
  # neither idempotent nor reversible, so it must never be cancelled part-way through. A
  # second run queues behind the one in flight instead of killing it.
  #
  # The key is the workflow name alone, with no ref or sha, so that two runs can never
  # overlap even when they carry different refs — a manual `gh workflow run` and an automatic
  # trigger can both aim at the same version, and a half-finished or doubled release costs far
  # more than a short wait. GitHub keeps at most one run pending per group, so a third arrival
  # supersedes the *pending* run, never the running one.
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  MISE_EXPERIMENTAL: true
  # Fail on a stale uv.lock instead of silently re-resolving on the runner.
  UV_LOCKED: 1

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # workflow_run fires on both success and failure; skip if the release workflow failed.
    # For all other triggers (push, workflow_dispatch, repository_dispatch), always run.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      || github.event_name != 'workflow_run'
    environment:
      name: pypi
      # cosmetic URL displayed in the GitHub UI for the environment,
      # not to be confused with the repository-url used by the pypa/gh-action-pypi-publish action,
      # which is the actual URL of the repository where the package is published
      url: https://pypi.org/p/nbkp/
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
      contents: read # checkout; a permissions block sets every scope it omits to none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Build the release tag, never whatever the branch head has become: a manual re-run
      # from main after a newer merge would otherwise publish that commit under the release's
      # name. A `release` run also completes successfully when it released nothing (a dry run,
      # a run dispatched on another branch), and only a commit carrying a v* tag was released.
      # See "Build what a release triggers from its tag" in
      # guidelines/project-setup/workflows.md in iglootools/common.
      - name: Check out the release tag
        id: release
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.tag || github.event.client_payload.tag }}
        run: |
          if [ -n "$REQUESTED" ]; then
            tag=$REQUESTED
          elif ! tag=$(git describe --exact-match --tags --match 'v*' HEAD 2>/dev/null); then
            if [ "$EVENT" = workflow_run ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice::$(git rev-parse --short HEAD) carries no v* tag, so the release run did not release. Nothing to publish."
              exit 0
            fi
            echo "::error::$(git rev-parse --short HEAD) carries no v* tag. Dispatch with -f tag=vX.Y.Z, or --ref vX.Y.Z."
            exit 1
          fi
          if [[ ! $tag =~ ^v[0-9] ]] || ! git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null; then
            echo "::error::$tag is not a release tag of this repository."
            exit 1
          fi
          git checkout -q --detach "refs/tags/$tag"
          echo "Publishing $tag ($(git rev-parse --short HEAD))"
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
        if: steps.release.outputs.skip != 'true'
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.11.12
      - run: mise run ci-build
        if: steps.release.outputs.skip != 'true'
      - name: Publish package distributions to PyPI
        if: steps.release.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
