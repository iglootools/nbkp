name: renovate-mise-lock

on:
  push:
    branches:
      - 'renovate/**'

# Avoid overlapping runs racing to push to the same branch. Stays here rather than in the shared
# workflow because concurrency governs the run these triggers create.
concurrency:
  group: renovate-mise-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mise-lock:
    permissions:
      # Must be granted here. `permissions` in the called workflow is a ceiling on what the
      # caller allowed, not a grant of its own, so without this the job regenerates mise.lock
      # and then cannot push it.
      contents: write
    uses: iglootools/common/.github/workflows/reusable-renovate-mise-lock.yml@46145e89385fd5aafc8e39ef25f4303ec30b4812 # v1.19.0
    with:
      # Pinned here, not in the shared workflow: guidelines/project-setup/workflows.md in
      # iglootools/common requires it to match the version this project's mise.lock was
      # generated with, and the custom manager below lives in this repository's renovate.json.
      # The input is named `version` because that is what that manager matches — see the
      # shared workflow's input description.
      # renovate: datasource=github-releases depName=jdx/mise
      version: 2026.10.11
