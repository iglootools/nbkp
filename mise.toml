[tools]
python = "3.14.6"
uv = "0.12.3"
github-cli = "2.97.0"
"aqua:asciinema/asciinema" = "3.2.1"
"aqua:asciinema/agg" = "1.9.0"

[env]
# Pin uv to the interpreter mise installed, by absolute path. mise's own docs are explicit
# that a bare version number is not enough: it "does not guarantee that uv uses the
# specific interpreter managed by mise — uv may fall back to a system or self-managed
# Python of the same version". This is also what makes a raised [tools] python pin actually
# recreate .venv, instead of uv reusing a venv built on the previous patch release because
# it still satisfies requires-python.
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }
UV_PYTHON_DOWNLOADS = "never"
UV_PYTHON_PREFERENCE = "only-system"

[settings]
lockfile = true

# `mise deps` is experimental. Set here rather than relying on MISE_EXPERIMENTAL in each
# developer's shell, so a fresh clone behaves the same as CI — otherwise the difference
# shows up as "dependencies mysteriously not installing".
experimental = true

# For uv projects mise documents python.uv_venv_auto ([settings]) rather than
# _.python.venv ([env]), which is "for projects that don't use uv". They are separate code
# paths, so this is a replacement and not an addition. mise locates the uv project by
# walking up for uv.lock, which means this no-ops until that file exists — if uv.lock is
# ever deleted or gitignored, activation silently stops rather than erroring.
#
# The cookbook pairs [deps.uv] with "source"; "create|source" is used here so that a venv is
# created rather than merely activated. Creation is idempotent and [deps.uv] populates it, so
# the two do not fight.
#
# On a genuinely fresh clone the first `mise install` prints
#   WARN uv is required to create the venv at <path>/.venv but is not installed
# and does not create it: env directives are resolved before the toolset is available. This
# is harmless — the first `mise run` invokes [deps.uv], whose `uv sync` creates .venv itself,
# and every run after that activates normally. It is also the second reason the tasks below
# use `uv run` rather than bare commands: on that first run there is no .venv/bin to be on
# PATH at all.
python.uv_venv_auto = "create|source"

# Runs `uv sync` before every `mise run`/`mise x`, but only when uv.lock or pyproject.toml
# changed or .venv went missing (blake3 source hashing) — so freshness costs one check per
# change instead of a sync per command. Use `mise run --no-deps <task>` to skip it.
#
# Only install_command() reads `run` — sources(), optional_outputs() and applicability() are
# unconditional — so overriding it for --all-extras keeps the built-in uv.lock hashing and
# .venv tracking. CI adds strictness through UV_LOCKED in the job env rather than a
# different command here, so local and CI runs stay identical.
#
# Tasks still invoke tools through `uv run --no-sync` rather than bare. mise activates this
# project's .venv but does not remove a *foreign* .venv/bin already on PATH, so in a shell
# where another project's venv is active, a bare `ruff` silently runs that project's copy
# (measured: this project's venv landed at PATH position 16, the foreign one at 1). `uv run`
# resolves the environment from the project root and ignores PATH, so it is immune. It is
# also not slower here, and --no-sync keeps installation the deps provider's job alone.
[deps.uv]
auto = true
run = "uv sync --all-extras"

# Build and Publishing Tasks
[tasks.clean]
description = "Clean up build artifacts"
run = """
rm -rf build/ dist/ *.egg-info/
find . -type d -name __pycache__ -delete
find . -type f -name "*.pyc" -delete
"""

[tasks.build]
description = "Build the package"
# rm -rf dist/ first: `uv build` does not clear the directory, and
# pypa/gh-action-pypi-publish uploads *everything* it finds in dist/, so a leftover artifact
# from an earlier build would be published alongside the current one.
#
# --sdist --wheel builds both directly from source. Plain `uv build` builds the wheel from
# the sdist instead, which is also correct here — hatchling writes the resolved version into
# the sdist's PKG-INFO and reads it back, verified by building a wheel from an extracted
# sdist with no .git and still getting the right version. This is the mildly stricter option
# (one fewer round-trip through generated metadata) at no cost, not a workaround.
#
# What does silently produce 0.0.0 is building from a *source tree* with no git history or
# tags — a shallow checkout, an exported archive, or Renovate's build. That exits
# successfully, which is why build-verify exists.
run = """
rm -rf dist/
uv build --sdist --wheel
"""

[tasks.build-verify]
description = "Fail if the built wheel carries the 0.0.0 fallback version"
run = "uv run --no-sync python build-scripts/verifyversion.py"

[tasks.publish]
description = "Publish to PyPI (requires authentication)"
run = "uv publish"

[tasks.install]
description = "Install dependencies"
# Delegates to the [deps.uv] provider rather than calling `uv sync` directly, so there is
# one definition of how dependencies get installed. Kept as a named task so that if the
# experimental deps engine has to be abandoned, this is the single place to change.
run = "mise deps install uv"

# `uv sync` is exact by default (it removes packages that are in neither pyproject.toml nor
# uv.lock), and [env] UV_PYTHON pins the interpreter, so a raised python pin recreates .venv
# on its own. Both of the reasons this task used to exist under poetry are therefore gone.
#
# It survives for the one gap [deps.uv] leaves: freshness is a blake3 hash of uv.lock and
# pyproject.toml, so a venv that is *dirty* rather than *stale* — someone ran `uv pip
# install` into it by hand — still reads as fresh and no sync fires. Deleting the directory
# is the way back to exactly what the lock describes.
[tasks.reinstall]
description = "Delete .venv and reinstall dependencies from scratch"
run = """
rm -rf "$MISE_PROJECT_ROOT/.venv"
mise deps install uv --force
"""

[tasks.check]
description = "Run all checks (format, lint, type-check, compat-check, lock-check, lock-check-uv, clidocs-check, configdocs-check, depgraph-check)"
run = [
  { task = "format" },
  { task = "lint" },
  { task = "type-check" },
  { task = "compat-check" },
  { task = "lock-check" },
  { task = "lock-check-uv" },
  { task = "clidocs-check" },
  { task = "configdocs-check" },
  { task = "depgraph-check" },
]

[tasks.check-all]
description = "Run all checks (format, lint, type-check, compat-check, test)"
run = [
  { task = "check" },
  { task = "test-all" },
]

# CI Workflow Tasks
[tasks.ci-test]
description = "Run all checks needed on CI"
run = [
  { task = "install" },
  { task = "build" },
  { task = "check-all" },
]

[tasks.ci-build]
description = "Run all checks needed on CI"
run = [
  { task = "install" },
  { task = "build" },
  { task = "build-verify" },
]

[tasks.ci-demo-record]
description = "Record the demo on CI"
run = [
  { task = "install" },
  { task = "demo-record" },
]

[tasks.ci-demo]
description = "Record and upload the demo on CI"
run = [
  { task = "install" },
  { task = "demo-record" },
  { task = "demo-upload" },
]

# Test Tasks
[tasks.test-unit]
description = "Run unit tests (no Docker, no external dependencies)"
# -n auto: distribute across worker processes (pytest-xdist). Unit tests are fully
# isolated (tmp_path, monkeypatch), so they parallelize cleanly.
run = "uv run --no-sync pytest tests/ --ignore=tests/e2e_docker/ --ignore=tests/integration_docker/ --ignore=tests/integration_fs/ -n auto -v"

[tasks.test-e2e]
description = "Run end-to-end sync tests (Docker)"
run = [
  { task = "test-e2e-docker" },
]

[tasks.test-e2e-docker]
description = "Run end-to-end sync tests (Docker only)"
# Serial on purpose (no -n auto). Unlike test-integration-docker — one light
# container per worker across many tests, so -n auto is a big win — each e2e
# test needs a multi-container topology (backup-server + bastion + proxy-jump)
# running the heaviest workload (btrfs + LUKS + multi-hop SSH). With only a
# handful of such tests, xdist would multiply that container and shared-kernel
# (loop-device / device-mapper) contention for negligible wall-clock gain.
# Nothing hard-blocks it (the Docker network is UUID-named, so per-worker
# isolation would just work) — it is purely a cost/benefit choice.
# See docs/building-and-testing.md "Parallel test execution".
run = "uv run --no-sync pytest tests/e2e_docker/ -v"

[tasks.test-integration]
description = "Run all integration tests (Docker + filesystem)"
run = [
  { task = "test-integration-fs" },
  { task = "test-integration-docker" },

  # Do not automatically. Does not work on CI and can cause issues on local machines due to the privileged Docker requirement.
  # Useful for local debugging of btrfs-related code changes.
  # { task = "test-integration-docker-btrfs" },
]

[tasks.test-integration-docker]
description = "Run all Docker-based tests (e2e + integration)"
# -n auto: session-scoped container fixtures are instantiated once per xdist worker,
# so each worker spins up its own privileged container. Those containers share the
# host VM kernel's loop-device pool and device-mapper namespace, so the testkit is
# built to keep them independent under concurrency: per-worker-unique LUKS mapper
# names, a pre-created loop-node pool with autoclear mounts, and startup cleanup of
# only stale (deleted-backing) loops. See entrypoint.sh / setup-luks.sh and the
# luks_mapper_name fixture.
run = "uv run --no-sync pytest tests/integration_docker/ -n auto -v"

[tasks.test-integration-docker-btrfs]
description = "Run local btrfs tests inside Docker (privileged)"
run = """
docker build -t nbkp-btrfs-test -f nbkp/remote/testkit/dockerbuild/Dockerfile.btrfs-local-test .
# /app is a rw bind mount of the host checkout, so the container can see (and would
# otherwise write to) the host's macOS .venv and uv.lock. UV_PROJECT_ENVIRONMENT and
# UV_FROZEN in the image are what actually prevent that; the anonymous volume
# (-v /app/.venv) additionally hides the macOS venv from the container entirely, and
# bounds the damage to an ephemeral container venv if those vars are ever dropped.
#
# This is the one place that keeps an explicit `uv run` and syncs directly rather than
# going through `mise deps`: there is no mise in the image, so neither python.uv_venv_auto
# nor [deps.uv] exists there. Do not "harmonize" it with the host-side tasks.
docker run --rm --privileged \
  -v $(pwd):/app -v /app/.venv -w /app nbkp-btrfs-test \
  uv run --frozen pytest tests/integration_docker/test_btrfs_local.py -v
"""

[tasks.test-integration-fs]
description = "Run filesystem integration tests"
# -n auto: each test isolates its real-rsync work under a unique tmp_path, so workers
# don't contend for shared filesystem state.
run = "uv run --no-sync pytest tests/integration_fs/ -n auto -v"

[tasks.test-all]
description = "Run all tests"
run = [
  { task = "test-unit" },
  { task = "test-integration" },
  { task = "test-e2e" },
]

# Lint / Formatting Tasks
[tasks.format]
description = "Format code with ruff"
run = "uv run --no-sync ruff format ."

[tasks.lint]
description = "Run ruff linting"
run = "uv run --no-sync ruff check nbkp/ tests/ build-scripts/"

[tasks.type-check]
description = "Run pyright type checking"
run = "uv run --no-sync pyright nbkp/ build-scripts/"

[tasks.compat-check]
description = "Verify no Python features above 3.12 are used"
run = "uv run --no-sync vermin --target=3.12- --no-tips --no-parse-comments nbkp/ tests/"

[tasks.lock-check]
description = "Check that mise.lock is up to date"
# The body lives in scripts/lock-check.sh: it needs `set -euo pipefail`, a trap, a subshell
# and a scratch directory, and the reasoning behind each of those is worth more room than a
# TOML string affords. See that file before changing anything here.
run = "./scripts/lock-check.sh"

# The uv.lock counterpart of lock-check, and the replacement for `poetry check --lock`:
# asserts uv.lock is consistent with pyproject.toml. Distinct from UV_LOCKED in CI, which
# asserts a sync would not *change* the lock. --check does not write.
[tasks.lock-check-uv]
description = "Check that uv.lock is up to date with pyproject.toml"
run = "uv lock --check"

# Demo Tasks
[tasks.demo]
description = "Record the demo and upload to asciinema.org"
run = [
  { task = "demo-record" },
  { task = "demo-upload" },
]

[tasks.demo-record]
description = "Record the demo and convert to GIF"
run = "./demo/record-demo.sh \"$(uv run --no-sync python -c 'import nbkp; print(nbkp.__version__)')\""

[tasks.demo-upload]
description = "Upload the locally recorded demo to asciinema.org"
run = "asciinema upload demo/demo.cast"

# Publishing from CI is disabled — GitHub-hosted runners have no route to
# asciinema.org (see .github/workflows/demo.yml). CI records the demo and keeps it as
# an artifact; this task is the manual half: fetch that artifact and publish it from a
# machine that can reach the host. On success it repoints the README's asciicast
# embed at the new recording and commits that one file. Forward flags with `--`:
#   mise run demo-upload-latest -- --dry-run     # fetch and report only
#   mise run demo-upload-latest -- --no-commit   # update README, leave it uncommitted
#   mise run demo-upload-latest -- --no-readme   # upload only
[tasks.demo-upload-latest]
description = "Download the demo recorded by CI and upload it to asciinema.org"
run = "uv run --no-sync python build-scripts/demoupload.py"

# Reference Documentation Generation Tasks
[tasks.reference-doc]
description = "Regenerate the reference documentation"
run = [
  { task = "clidocs" },
  { task = "configdocs" },
  { task = "depgraph" },
]

[tasks.clidocs]
description = "Regenerate CLI reference in docs/usage.md"
run = "uv run --no-sync python build-scripts/clidocs.py"

[tasks.clidocs-check]
description = "Check that CLI reference in docs/cli-reference.md is up to date"
run = "uv run --no-sync python build-scripts/clidocs.py --check"

[tasks.configdocs]
description = "Regenerate config reference tables in docs/concepts.md"
run = "uv run --no-sync python build-scripts/configdocs.py"

[tasks.configdocs-check]
description = "Check that config reference tables in docs/concepts.md are up to date"
run = "uv run --no-sync python build-scripts/configdocs.py --check"

[tasks.depgraph]
description = "Regenerate Module Overview in docs/architecture.md"
run = "uv run --no-sync python build-scripts/depgraph.py"

[tasks.depgraph-check]
description = "Check that Module Overview in docs/architecture.md is up to date"
run = "uv run --no-sync python build-scripts/depgraph.py --check"

[tasks.depgraph-ascii]
description = "Generate module dependency graph (ASCII art)"
run = "uv run --no-sync python build-scripts/depgraph.py --format ascii"

[tasks.depgraph-mermaid]
description = "Print module dependency graph (mermaid syntax) to stdout"
run = "uv run --no-sync python build-scripts/depgraph.py --format mermaid"
