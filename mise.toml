[tools]
python = "3.15.2"
uv = "0.13.7"
github-cli = "2.103.3"
"aqua:asciinema/asciinema" = "3.2.1"
"aqua:asciinema/agg" = "1.9.0"
# demo-magic's simulated typing (demo-record). conda-forge is the only mise source with
# current pv binaries, and it has none for Windows, where the demo does not run anyway.
"conda:pv" = { version = "1.12.7", os = ["linux", "macos"] }
shellcheck = "0.11.0"
actionlint = "1.7.12"
dprint = "0.64.3"
rumdl = "0.3.4"
# Renovate, for lint-renovate and renovate-dry-run (guidelines/project-setup/dependency-automation.md
# in iglootools/common, which explains both options). trust_policy_excludes exempts one reviewed
# release, published by hand without provenance. Drop the exclusion once Renovate no longer
# resolves to @yarnpkg/libzip@3.2.2; reviewed in iglootools/common's mise.toml. allow_builds lets
# re2 build its native module, so the validator checks regexes with RE2, the engine Renovate runs.
"npm:renovate" = { version = "44.239.1", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"], allow_builds = ["re2"] }
node = "26.13.1"
jq = "1.8.2"

[env]
# Pin uv to mise's interpreter by absolute path (guidelines/project-setup/python-tooling.md in
# iglootools/common, "Pin uv to mise's interpreter by absolute path").
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }
UV_PYTHON_DOWNLOADS = "never"
UV_PYTHON_PREFERENCE = "only-system"

[settings]
lockfile = true
# [deps.uv] installs the environment and mise only sources it (python-tooling.md, "Let
# `[deps.uv]` install the environment, and mise only source it").
experimental = true
python.uv_venv_auto = "source"

# Runs `uv sync` before every `mise run`, only when uv.lock or pyproject.toml changed or .venv is
# missing; `--all-extras` because the tests cover the docker and keyring extras.
[deps.uv]
auto = true
run = "uv sync --all-extras"

[tasks.build-verify]
description = "Fail if the built wheel carries the 0.0.0 fallback version"
run = "uv run --no-sync iglootools python verify-version"

[tasks.build]
description = "Build the sdist and wheel into an emptied dist/"
run = "uv run --no-sync iglootools python build"

[tasks.clean]
description = "Delete build artifacts and Python bytecode outside .venv"
run = "uv run --no-sync iglootools python clean"

[tasks.reinstall]
description = "Delete .venv and reinstall dependencies from scratch"
run = "uv run --no-sync iglootools python reinstall"

[tasks.lint-shell]
description = "Lint the tracked shell scripts with shellcheck"
run = "uv run --no-sync iglootools shell lint"

[tasks.lint-github-actions]
description = "Lint the tracked GitHub Actions workflows with actionlint"
run = "uv run --no-sync iglootools github lint"

# Every pin on iglootools/common names the same release, and `iglootools common adopt` would
# move each one (guidelines/project-setup/iglootools-cli.md in iglootools/common).
[tasks.lint-common-pins]
description = "Check that every pin on iglootools/common agrees (fix with `iglootools common adopt`)"
run = "uv run --no-sync iglootools common check-pins"

[tasks.lint-lock-mise]
description = "Check that mise.lock is up to date with mise.toml"
run = "uv run --no-sync iglootools mise lock-check"

# python-tooling.md, "Keep `install` and `reinstall` as tasks over `mise deps`".
[tasks.install]
description = "Install dependencies"
run = "mise deps install uv"

# Task families (guidelines/project-setup/mise.md in iglootools/common, "Name tasks by
# family"): a task that rewrites files is named for what it writes (fmt, toc, clidocs), anything
# that fails without writing is a lint-*, and preflight runs every lint and test before a push,
# the lints and the tests in parallel.

[tasks.preflight]
description = "Run every lint and every test, Docker suites included (what CI runs, across its three jobs)"
run = [{ tasks = ["lint", "test"] }]

[tasks.preflight-quick]
description = "Run every lint and the unit tests"
run = [{ tasks = ["lint", "test-unit"] }]

# CI runs three jobs in parallel, one per ci-* task: the two Docker suites take about a
# minute each and do not need each other, so running them one after the other only made
# CI wait. Together the three cover preflight; the first adds the filesystem suite, which
# needs no Docker, to preflight-quick.
[tasks.ci-preflight-quick]
description = "Install, then run every lint and the unit and filesystem tests (CI job 1/3)"
run = [
  { task = "install" },
  { task = "preflight-quick" },
  { task = "test-integration-fs" },
]

[tasks.ci-test-docker]
description = "Run the Docker integration tests (CI job 2/3)"
run = [
  { task = "install" },
  { task = "test-integration-docker" },
]

[tasks.ci-test-e2e]
description = "Run the end-to-end Docker tests (CI job 3/3)"
run = [
  { task = "install" },
  { task = "test-e2e-docker" },
]

[tasks.ci-build]
description = "Install, build the package and verify its version (the preflight build job and the publish workflows)"
run = [
  { task = "install" },
  { task = "build" },
  { task = "build-verify" },
]

# Run by the shared reusable-demo.yml workflow (iglootools/common) that demo.yml calls.
[tasks.ci-demo-record]
description = "Record the demo on CI"
run = [
  { task = "install" },
  { task = "demo-record" },
]

[tasks.test-unit]
description = "Run unit tests (no Docker, no external dependencies)"
# -n auto: distribute across worker processes (pytest-xdist). Unit tests are fully
# isolated (tmp_path, injected fakes), so they parallelize cleanly.
run = "uv run --no-sync pytest tests/ --ignore=tests/e2e_docker/ --ignore=tests/integration_docker/ --ignore=tests/integration_fs/ -n auto -v"

[tasks.test-e2e]
description = "Run end-to-end sync tests (Docker)"
run = [
  { task = "test-e2e-docker" },
]

[tasks.test-e2e-docker]
description = "Run end-to-end sync tests (Docker only)"
# -n 3, one worker per test: each e2e test needs a multi-container topology
# (backup-server + bastion + proxy-jump), so every worker brings up its own. The
# Docker network is UUID-named and the testkit isolates the shared kernel resources
# (see test-integration-docker), so the topologies stay independent. It halves the
# suite (36s to 18s locally). Raise the count when tests are added: beyond one
# worker per test it only multiplies container start-up.
# See docs/building-and-testing.md "Parallel test execution".
run = "uv run --no-sync pytest tests/e2e_docker/ -n 3 -v"

[tasks.test-integration]
description = "Run all integration tests (Docker + filesystem)"
run = [
  { task = "test-integration-fs" },
  { task = "test-integration-docker" },
]

[tasks.test-integration-docker]
description = "Run the Docker integration tests (tests/integration_docker/; e2e is test-e2e)"
# -n auto: session-scoped container fixtures are instantiated once per xdist worker,
# so each worker spins up its own privileged container. Those containers share the
# host VM kernel's loop-device pool and device-mapper namespace, so the testkit is
# built to keep them independent under concurrency: per-worker-unique LUKS mapper
# names, a pre-created loop-node pool with autoclear mounts, and startup cleanup of
# only stale (deleted-backing) loops. See entrypoint.sh / setup-luks.sh and the
# luks_mapper_name fixture.
run = "uv run --no-sync pytest tests/integration_docker/ -n auto -v"

[tasks.test-integration-fs]
description = "Run filesystem integration tests"
# -n auto: each test isolates its real-rsync work under a unique tmp_path, so workers
# don't contend for shared filesystem state.
run = "uv run --no-sync pytest tests/integration_fs/ -n auto -v"

[tasks.test]
description = "Run all tests"
run = [
  { task = "test-unit" },
  { task = "test-integration" },
  { task = "test-e2e" },
]

# Writers. ruff formats the Python, dprint the JSON, TOML, YAML and Dockerfiles, rumdl the
# Markdown. See guidelines/project-setup/formatting.md in iglootools/common.
[tasks.fmt]
description = "Format every file with ruff, dprint and rumdl (rewrites files; lint-fmt verifies only)"
run = [
  { task = "fmt-ruff" },
  { task = "fmt-dprint" },
  { task = "fmt-rumdl" },
]

[tasks.fmt-ruff]
description = "Format the Python with ruff"
run = "uv run --no-sync ruff format ."

[tasks.fmt-dprint]
description = "Format the JSON, TOML, YAML and Dockerfiles with dprint"
run = "dprint fmt"

[tasks.fmt-rumdl]
description = "Format the Markdown with rumdl"
run = "rumdl fmt ."

# Lints: each fails without writing anything.
[tasks.lint]
description = "Run every lint"
run = [
  { task = "lint-fmt" },
  { task = "lint-ruff" },
  { task = "lint-shell" },
  { task = "lint-github-actions" },
  { task = "lint-markdown" },
  { task = "lint-types" },
  { task = "lint-lock-mise" },
  { task = "lint-lock-uv" },
  { task = "lint-toc" },
  { task = "lint-clidocs" },
  { task = "lint-configdocs" },
  { task = "lint-depgraph" },
  { task = "lint-boundaries" },
  { task = "lint-dead-code" },
  { task = "lint-renovate" },
  { task = "lint-common-pins" },
]

# The formatters exit 0 whether or not they changed anything, so only their check form can gate
# (guidelines/project-setup/formatting.md, "Gate formatting with `lint-fmt` and `lint-markdown`").
[tasks.lint-fmt]
description = "Check that every file is formatted (fix with `mise run fmt`)"
run = [
  { task = "lint-fmt-ruff" },
  { task = "lint-fmt-dprint" },
]

[tasks.lint-fmt-ruff]
description = "Check that the Python is formatted (fix with `mise run fmt-ruff`)"
run = "uv run --no-sync ruff format --check ."

[tasks.lint-fmt-dprint]
description = "Check that the JSON, TOML, YAML and Dockerfiles are formatted (fix with `mise run fmt-dprint`)"
run = "dprint check"

[tasks.lint-markdown]
description = "Lint the Markdown with rumdl (configured in .rumdl.toml; fix what it can with `mise run fmt-rumdl`)"
run = "rumdl check ."

[tasks.lint-ruff]
description = "Lint the Python with ruff"
run = "uv run --no-sync ruff check ."

[tasks.lint-types]
description = "Type-check with pyright"
run = "uv run --no-sync pyright"

# python-tooling.md, "Assert the lock in CI with `UV_LOCKED=1` and in `lint` with `uv lock --check`".
[tasks.lint-lock-uv]
description = "Check that uv.lock is up to date with pyproject.toml"
run = "uv lock --check"

[tasks.demo]
description = "Record the demo and upload to asciinema.org"
run = [
  { task = "demo-record" },
  { task = "demo-upload" },
]

[tasks.demo-preflight]
description = "Check that the demo's dependencies (Docker, pv, asciinema, nbkp) are installed"
run = "demo/preflight.sh"

[tasks.demo-record]
description = "Record the demo to demo/demo.cast"
# The recording reports only that the session failed; a missing tool shows up only in
# the cast, so check first.
depends = ["demo-preflight"]
run = "uv run --no-sync iglootools demo record"

[tasks.demo-upload]
description = "Upload the locally recorded demo to asciinema.org"
run = "asciinema upload demo/demo.cast"

# Publishing from CI is disabled — GitHub-hosted runners have no route to
# asciinema.org (see .github/workflows/demo.yml). CI records the demo and keeps it as
# an artifact; this task is the manual half: fetch that artifact and publish it from a
# machine that can reach the host. On success it repoints the README's asciicast
# embed at the new recording and commits that one file. Forward flags with `--`:
#   mise run demo-upload-latest -- --dry-run     # fetch and report only
#   mise run demo-upload-latest -- --no-commit   # update README, leave it uncommitted
#   mise run demo-upload-latest -- --no-readme   # upload only
[tasks.demo-upload-latest]
description = "Download the demo recorded by CI and upload it to asciinema.org"
run = "uv run --no-sync iglootools demo upload"

# marketing/ holds posts pasted into other sites, Reddit's among them, which a table of contents
# would only clutter.
[tasks.toc]
description = "Add and regenerate the tables of contents in the Markdown docs"
run = "uv run --no-sync iglootools docs toc --exclude 'marketing/**'"

[tasks.lint-toc]
description = "Check that every Markdown document has an up-to-date table of contents (fix with `mise run toc`)"
run = "uv run --no-sync iglootools docs toc --check --exclude 'marketing/**'"

[tasks.reference-doc]
description = "Regenerate the reference documentation"
run = [
  { task = "clidocs" },
  { task = "configdocs" },
  { task = "depgraph" },
]

[tasks.clidocs]
description = "Regenerate CLI reference in docs/cli-reference.md"
run = "uv run --no-sync iglootools docs cli"

[tasks.lint-clidocs]
description = "Check that the CLI reference in docs/cli-reference.md is up to date (fix with `mise run clidocs`)"
run = "uv run --no-sync iglootools docs cli --check"

[tasks.configdocs]
description = "Regenerate config reference tables in docs/config-reference.md"
run = "uv run --no-sync python build-scripts/configdocs.py"

[tasks.lint-configdocs]
description = "Check that the config reference tables in docs/config-reference.md are up to date (fix with `mise run configdocs`)"
run = "uv run --no-sync python build-scripts/configdocs.py --check"

[tasks.depgraph]
description = "Regenerate Module Overview in docs/architecture.md"
run = "uv run --no-sync iglootools docs depgraph"

[tasks.lint-depgraph]
description = "Check that the Module Overview in docs/architecture.md is up to date (fix with `mise run depgraph`)"
run = "uv run --no-sync iglootools docs depgraph --check"

[tasks.lint-boundaries]
description = "Check module boundaries (import-linter contracts in pyproject.toml)"
run = "uv run --no-sync lint-imports"

[tasks.lint-dead-code]
description = "Check for unused code (deadcode, configured in pyproject.toml)"
run = "uv run --no-sync deadcode nbkp tests build-scripts"

[tasks.depgraph-ascii]
description = "Generate module dependency graph (ASCII art)"
run = "uv run --no-sync iglootools docs depgraph --format ascii"

[tasks.depgraph-mermaid]
description = "Print module dependency graph (mermaid syntax) to stdout"
run = "uv run --no-sync iglootools docs depgraph --format mermaid"

# --strict fails on a config Renovate would migrate, which a plain run reports only as a
# warning. With no argument it validates renovate.json as repository config.
[tasks.lint-renovate]
description = "Validate the Renovate config with Renovate's validator, strictly"
run = "renovate-config-validator --strict"
