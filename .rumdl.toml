# rumdl's defaults, with only what it takes to make them usable. The reasoning is in
# guidelines/project-setup/formatting.md in iglootools/common.

[MD013]
# Off by default, which leaves every long line a warning only a hand edit can fix. On, `rumdl fmt`
# rewraps prose to the default 80 columns.
reflow = true
# A code block cannot be rewrapped without changing what it shows: a command, a config file, a
# log line.
code-blocks = false
# A heading cannot be wrapped either, and its text is its anchor: shortening one to fit breaks
# every link to it.
headings = false

[global]
# Generated whole by `iglootools docs cli` (mise run clidocs). Reformatting it would fail
# clidocs-check on the next regeneration; its generator owns its format. Generated sections
# inside hand-written documents are fenced with <!-- rumdl-disable --> / <!-- rumdl-enable -->
# outside their markers instead.
exclude = ["docs/cli-reference.md"]
