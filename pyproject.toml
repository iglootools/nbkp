[project]
name = "nbkp"
description = "Nomad Backup: An rsync-based backup tool for nomadic setups where sources and destinations aren't always available — laptops on the move, removable drives, home servers behind changing networks. Sentinel files ensure backups only run when volumes are genuinely present, with optional btrfs or hard-link snapshots for point-in-time recovery."
readme = "README.md"
# The latest stable Python, as guidelines/project-setup/python-tooling.md in iglootools/common
# sets ("Target the latest stable Python, unless others install the package"). pyyaml ships no
# wheel for it yet and builds from its sdist, which preflight.yml caches.
requires-python = ">=3.15,<3.16"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sami Dalouche", email = "sami.dalouche@gmail.com" }]
dependencies = [
  "fabric>=3.0,<4.0",
  # Imported directly (exception types, SSH config parsing), not only through fabric, so
  # its major is bounded here rather than left to whatever fabric allows.
  "paramiko>=5.0,<6.0",
  "jinja2>=3.0,<4.0",
  "pydantic>=2.14.1,<3.0.0",
  # Imported directly (PydanticCustomError, ErrorDetails, which pydantic does not
  # re-export), so its major is bounded here. pydantic pins the exact release it needs.
  "pydantic-core>=2.50,<3.0",
  "pyyaml>=6.0,<7.0",
  "typer>=0.27.0,<1.0.0",
  # Imported directly for all output, not only through typer, which may leave it unbounded
  # or make it optional.
  "rich>=15.0,<16.0",
  "platformdirs>=4.11.0,<5.0",
  "mermaid-ascii-diagrams>=0.1.1,<0.2",
]
dynamic = ["version"]

[project.optional-dependencies]
# cryptography generates the demo's SSH key (nbkp/remote/testkit/docker.py). paramiko
# brings it in anyway, but it is imported directly, so its major is bounded here.
docker = ["docker>=7.2.0,<8.0", "cryptography>=50.0,<51.0"]
keyring = ["keyring>=25.0,<26.0"]

[project.scripts]
nbkp = "nbkp.cli:main"
nbkp-demo = "nbkp.demo.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.17,<0.18",
  "pyright>=1.1,<2.0",
  "pytest>=9.1.1,<10.0",
  "pytest-xdist>=3.5.0,<4.0",
  "testcontainers>=4.15.0,<5.0",
  # Also declared as the `keyring` extra above. The extra is the shipped contract
  # (`uv tool install 'nbkp[keyring]'`); this entry guarantees the test suite has it
  # regardless of which extras are synced. Identical constraints, so uv resolves both to
  # one entry in uv.lock.
  "keyring>=25.0,<26.0",
  "import-linter>=2.15,<3.0",
  "deadcode>=2.7.0,<3.0",
  # The shared build, docs and check commands (guidelines/project-setup/iglootools-cli.md in
  # iglootools/common). Pinned to the release tag; uv.lock records the commit it resolved to.
  "iglootools @ git+https://github.com/iglootools/common@v2.5.0",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Paired with `mise run build-verify` (python-tooling.md, "Guard against a `0.0.0` release").
[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"

# python-tooling.md, "Tell hatchling what to package". The wheel also carries the non-Python
# payload read at runtime: the jinja2 templates under nbkp/sh/templates/ (importlib.resources)
# and the Dockerfiles and shell scripts under nbkp/remote/testkit/dockerbuild/
# (Path(__file__).parent), so they must be real files in the installed tree.
[tool.hatch.build.targets.wheel]
packages = ["nbkp"]

[tool.hatch.build.targets.sdist]
only-include = ["nbkp"]

[tool.hatch.build]
exclude = [".DS_Store"]

[tool.uv]
# Keeps `nbkp --version` honest in the editable install (python-tooling.md, "Keep the version
# honest in editable installs").
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

# The only pin on the build backend (python-tooling.md, "Pin the build backend explicitly").
# Regenerate with:
#   printf '%s\n' hatchling uv-dynamic-versioning \
#     | uv pip compile - --no-annotate --no-header --quiet
build-constraint-dependencies = [
  "dunamai==1.26.5",
  "hatchling==1.33.0",
  "jinja2==3.1.6",
  "markupsafe==3.0.4",
  "packaging==26.3",
  "pathspec==1.1.1",
  "pluggy==1.7.0",
  "tomlkit==0.15.2",
  "trove-classifiers==2026.9.21.13",
  "uv-dynamic-versioning==0.14.1",
]

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
# Every rule, minus those our conventions are against: iglootools/common's
# docs/architecture-decision-record.md, ADR-003, gives the reason for each entry in
# `ignore` below. preview turns on PLW1514 (still a preview rule);
# explicit-preview-rules keeps ALL from selecting the other preview rules.
#
# TID255: a `lazy` import that module-level code uses right away (a global, a base
# class, a decorator argument) is reified at import time anyway, so `lazy` silently
# does nothing. That nbkp.cli stays free of the heavy imports is asserted by
# tests/test_startup_imports.py; this catches the per-statement mistake.
#
# TID251: tests inject fakes through parameters instead of patching (docs/guidelines.md,
# Tests). unittest.mock is banned, and so is pytest.MonkeyPatch: tests/conftest.py
# replaces the monkeypatch fixture with one that fails, so the class is the only way
# left to patch. Each documented exception carries `# noqa: TID251` on its import, and RUF100
# reports a noqa that is no longer needed.
preview = true
explicit-preview-rules = true
select = ["ALL"]
extend-select = ["PLW1514"]
# deadcode's `# noqa: DCxx` markers, which RUF100 and RUF102 would otherwise report.
external = ["DC"]
ignore = [
  # Each is the opposite of a D rule we keep: D211 and D213.
  "D203",
  "D212",
  # The LICENSE file covers every file.
  "CPY001",
  # Imports stay at module level, never in a TYPE_CHECKING block.
  "TC001",
  "TC002",
  "TC003",
  # The explicit else python.md asks for.
  "RET505",
  "RET506",
  "RET507",
  "RET508",
  # They count each case of a match.
  "C901",
  "PLR0911",
  "PLR0912",
  # Keyword seams add parameters by design; PLR0917 still caps positional ones.
  "PLR0913",
  # A command is an argument list, its program found on PATH.
  "S603",
  "S607",
]

[tool.ruff.lint.per-file-ignores]
# A test's name says what it checks; pytest asserts with assert; a test's literals are its
# specification; its "secrets" are fakes or keyring entry names. S108 stays on: a test
# writes under tmp_path, never /tmp.
"tests/**" = ["D1", "PLR2004", "S101", "S105", "S106", "S107"]
# A directory of scripts mise runs by path, not a package to import.
"build-scripts/**" = ["INP001"]

[tool.ruff.lint.pylint]
max-statements = 30

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock".msg = "Inject a fake through a parameter instead of patching (docs/guidelines.md, Tests)."
"pytest.MonkeyPatch".msg = "Inject a fake through a parameter instead of patching (docs/guidelines.md, Tests)."

[tool.ruff.lint.isort]
# Keep aliased re-imports in the same `from x import (a, b as c)` block instead of
# emitting a duplicate import statement per alias.
combine-as-imports = true

[tool.pytest.ini_options]
# build-scripts/ holds scripts, not a package: this lets tests/build_scripts/ import them.
# pyright's extraPaths below does the same for type checking.
pythonpath = ["build-scripts"]

[tool.pyright]
include = ["nbkp", "tests", "build-scripts"]
extraPaths = ["build-scripts"]
pythonVersion = "3.15"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"
# uv creates the project venv at .venv; restating it here is what lets editors and
# language servers resolve imports against it, since they inherit no shell activation.
venvPath = "."
venv = ".venv"

# Module layering rules, enforced by `mise run lint-boundaries` (part of `lint`).
# The rationale for each rule is in docs/architecture.md#layering.
[tool.importlinter]
root_package = "nbkp"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core modules do not depend on presentation, CLI frameworks or command wiring"
type = "forbidden"
# Enumerated: a new core package belongs on this list (and in the layers
# contract below).
source_modules = [
  "nbkp.config",
  "nbkp.credentials",
  "nbkp.demo",
  "nbkp.disks",
  "nbkp.fsprotocol",
  "nbkp.ordering",
  "nbkp.policy",
  "nbkp.preflight",
  "nbkp.remote",
  "nbkp.run",
  "nbkp.sh",
  "nbkp.snapshots",
  "nbkp.sync",
]
forbidden_modules = [
  "rich",
  "typer",
  "nbkp.clidisplay",
  "nbkp.cliwiring",
  "nbkp.cli",
  "nbkp.*.cli",
]
ignore_imports = [
  # Each module's cli/ sub-app sits above the core.
  "nbkp.*.cli.** -> **",
  "nbkp.*.cli -> **",
  # Output (rendering) modules may use Rich and the shared presentation
  # helpers, but not Typer, the command wiring or the CLI. That core code
  # does not import its output modules (and so never loads Rich) is checked
  # by tests/test_core_imports.py: an ignored edge cannot be checked here.
  "nbkp.**.output.** -> rich",
  "nbkp.**.output -> rich",
  "nbkp.**.output.** -> nbkp.clidisplay",
  "nbkp.**.output.** -> nbkp.clidisplay.**",
  "nbkp.**.output -> nbkp.clidisplay",
]

[[tool.importlinter.contracts]]
name = "CLI sub-apps do not import each other (shared wiring lives in nbkp.cliwiring)"
type = "independence"
# An expression rather than a list, so a new package's cli/ is covered too.
modules = ["nbkp.*.cli"]

[[tool.importlinter.contracts]]
name = "Only the entry point imports the root CLI app"
type = "protected"
protected_modules = ["nbkp.cli"]
allowed_importers = []

[[tool.importlinter.contracts]]
name = "Only the root app imports a CLI sub-app"
type = "protected"
# The forbidden contract above cannot see a core module importing its own
# cli/ package: it skips a source and a target that overlap.
protected_modules = ["nbkp.*.cli"]
allowed_importers = ["nbkp.cli"]

[[tool.importlinter.contracts]]
name = "Only presentation code imports output modules"
type = "protected"
# Core code never imports an output module, its own included, which the
# forbidden contract above cannot check once output modules may use Rich.
protected_modules = ["nbkp.**.output"]
allowed_importers = [
  "nbkp.cli",
  "nbkp.*.cli",
  "nbkp.clidisplay",
  "nbkp.cliwiring",
  "nbkp.**.output",
]

[[tool.importlinter.contracts]]
name = "Only the demo and other testkits import a testkit"
type = "protected"
# Testkits ship in the wheel for `nbkp demo`, and some import optional extras
# (remote/testkit/docker.py needs the `docker` extra): an import from runtime
# code would fail on a plain install. The layers contract cannot see it, since a
# testkit sits in its package's layer.
protected_modules = ["nbkp.**.testkit"]
allowed_importers = ["nbkp.demo", "nbkp.**.testkit"]

[[tool.importlinter.contracts]]
name = "Command wiring sits below the CLI sub-apps"
type = "forbidden"
source_modules = ["nbkp.cliwiring"]
forbidden_modules = ["nbkp.cli", "nbkp.*.cli"]

[[tool.importlinter.contracts]]
name = "Core packages are layered (config at the base)"
type = "layers"
# Highest first: a package may import the layers below it, never one above.
# `|` separates siblings that must not import each other either.
# A new core package belongs in one of these layers, and on the source list
# of the first contract.
layers = [
  "nbkp.demo",
  "nbkp.run | nbkp.sh",
  "nbkp.sync",
  "nbkp.snapshots",
  "nbkp.preflight",
  "nbkp.disks",
  "nbkp.credentials | nbkp.ordering",
  "nbkp.remote",
  "nbkp.policy | nbkp.fsprotocol",
  "nbkp.config",
]
ignore_imports = [
  # Each module's cli/ sub-app sits above every core package; its imports
  # are checked by the CLI contracts instead.
  "nbkp.*.cli.** -> **",
  "nbkp.*.cli -> **",
]

[[tool.importlinter.contracts]]
name = "Other packages import nbkp.disks only through the package"
type = "forbidden"
# Its __init__ is its interface; its submodules are implementation details,
# except its output, cli and testkit packages. Every other nbkp package: a new package
# belongs on this list.
source_modules = [
  "nbkp.cli",
  "nbkp.clidisplay",
  "nbkp.cliwiring",
  "nbkp.config",
  "nbkp.credentials",
  "nbkp.demo",
  "nbkp.fsprotocol",
  "nbkp.ordering",
  "nbkp.policy",
  "nbkp.preflight",
  "nbkp.remote",
  "nbkp.run",
  "nbkp.sh",
  "nbkp.snapshots",
  "nbkp.sync",
]
forbidden_modules = ["nbkp.disks.**"]
# Importing nbkp.disks reaches its submodules through its __init__.
allow_indirect_imports = true
ignore_imports = [
  # Its rendering of mount and disk results, which the command wiring and demo seed print.
  "** -> nbkp.disks.output",
  # The root app mounts the disks sub-app.
  "nbkp.cli.app -> nbkp.disks.cli",
]

[[tool.importlinter.contracts]]
name = "Other packages import nbkp.preflight only through the package"
type = "forbidden"
# Its __init__ is its interface; its submodules are implementation details,
# except its output, cli and testkit packages. Every other nbkp package: a new package
# belongs on this list.
source_modules = [
  "nbkp.cli",
  "nbkp.clidisplay",
  "nbkp.cliwiring",
  "nbkp.config",
  "nbkp.credentials",
  "nbkp.demo",
  "nbkp.disks",
  "nbkp.fsprotocol",
  "nbkp.ordering",
  "nbkp.policy",
  "nbkp.remote",
  "nbkp.run",
  "nbkp.sh",
  "nbkp.snapshots",
  "nbkp.sync",
]
forbidden_modules = ["nbkp.preflight.**"]
# Importing nbkp.preflight reaches its submodules through its __init__.
allow_indirect_imports = true
ignore_imports = [
  # Its rendering of preflight results, which the command wiring prints and the sync and
  # snapshot output reuses.
  "** -> nbkp.preflight.output",
  "** -> nbkp.preflight.output.**",
  # Its sample results, which demo output renders without a real check.
  "** -> nbkp.preflight.testkit",
  # The root app mounts the preflight sub-app.
  "nbkp.cli.app -> nbkp.preflight.cli",
]

[[tool.importlinter.contracts]]
name = "clidisplay is a presentation leaf"
type = "forbidden"
source_modules = ["nbkp.clidisplay"]
# Every nbkp package except policy: a new package belongs on this list.
# Typer too: every output module imports clidisplay, and output modules do
# not load Typer.
forbidden_modules = [
  "typer",
  "nbkp.cli",
  "nbkp.cliwiring",
  "nbkp.config",
  "nbkp.credentials",
  "nbkp.demo",
  "nbkp.disks",
  "nbkp.fsprotocol",
  "nbkp.ordering",
  "nbkp.preflight",
  "nbkp.remote",
  "nbkp.run",
  "nbkp.sh",
  "nbkp.snapshots",
  "nbkp.sync",
]

# Unused code, enforced by `mise run lint-dead-code` (part of `lint`). Each entry is code
# that runs without being named in the project, so the scan cannot see it used.
[tool.deadcode]
ignore-names-if-decorated-with = [
  "@*.command", # Typer registers commands and callbacks by decorator
  "@*.callback",
  "@pytest.fixture", # pytest injects fixtures by parameter name
  "@field_validator", # Pydantic calls validators while validating
  "@model_validator",
  "@field_serializer", # and serializers while serializing
]
ignore-names = [
  "main", # the [project.scripts] entry point
  "model_config", # read by Pydantic
  "pytestmark", # read by pytest
  "pytest_plugins",
  "pytest_*",
  "side_effect", # MagicMock's, set on the documented Connection patch
]
