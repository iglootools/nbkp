[project]
name = "nbkp"
description = "Nomad Backup: An rsync-based backup tool for nomadic setups where sources and destinations aren't always available — laptops on the move, removable drives, home servers behind changing networks. Sentinel files ensure backups only run when volumes are genuinely present, with optional btrfs or hard-link snapshots for point-in-time recovery."
readme = "README.md"
# Floor is the same version as local development and CI (mise.toml [tools] python): the
# latest stable CPython every dependency ships wheels for. The upper bound keeps installs off
# an untested Python. See common/guidelines/coding/python.md "Python Version Policy".
requires-python = ">=3.15,<3.16"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sami Dalouche", email = "sami.dalouche@gmail.com" }]
dependencies = [
  "fabric>=3.0,<4.0",
  # Imported directly (exception types, SSH config parsing), not only through fabric, so
  # their majors are bounded here rather than left to whatever fabric allows.
  "invoke>=2.2,<3.0",
  "paramiko>=5.0,<6.0",
  "jinja2>=3.0,<4.0",
  "pydantic>=2.14.1,<3.0.0",
  "pyyaml>=6.0,<7.0",
  "typer>=0.27.0,<1.0.0",
  "platformdirs>=4.11.0,<5.0",
  "mermaid-ascii-diagrams>=0.1.1,<0.2",
]
dynamic = ["version"]

[project.optional-dependencies]
docker = ["docker>=7.2.0,<8.0"]
keyring = ["keyring>=25.0,<26.0"]

[project.scripts]
nbkp = "nbkp.cli:main"
nbkp-demo = "nbkp.demo:main"

[dependency-groups]
dev = [
  "ruff>=0.17,<0.18",
  "pyright>=1.1,<2.0",
  "pytest>=9.1.1,<10.0",
  "pytest-xdist>=3.5.0,<4.0",
  "testcontainers>=4.15.0,<5.0",
  # The `python = ">=3.12,<4.0"` marker this carried under poetry is subsumed by
  # [project] requires-python, so it is dropped rather than translated.
  "pydeps>=3.0.7,<4.0",
  # Also declared as the `keyring` extra above. The extra is the shipped contract
  # (`uv tool install 'nbkp[keyring]'`); this entry guarantees the test suite has it
  # regardless of which extras are synced. Identical constraints, so uv resolves both to
  # one entry in uv.lock.
  "keyring>=25.0,<26.0",
  "import-linter>=2.15,<3.0",
  "deadcode>=2.7.0,<3.0",
  # The shared build, docs and check commands (guidelines/project-setup/iglootools-cli.md in
  # iglootools/common). Pinned to the release tag; uv.lock records the commit it resolved to.
  "iglootools @ git+https://github.com/iglootools/common@v1.28.0",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
# Required, not optional: Renovate runs `uv lock --upgrade-package`, which triggers a
# build with no git context, and without a fallback every such PR fails outright.
#
# The cost is that "no git history" becomes a *successful* build producing 0.0.0 rather
# than an error — nothing else in the publish path would catch that, and a version number
# cannot be reused once PyPI has it. `mise run build-verify` is what closes the gap.
fallback-version = "0.0.0"

# Explicit rather than relying on hatchling's <NAME>/__init__.py heuristic: when the
# heuristic misses, the failure mode is a silently empty wheel rather than an error.
# This also carries the non-Python payload that ships inside the package — the jinja2
# templates under nbkp/sh/templates/ and the Dockerfiles and shell scripts under
# nbkp/remote/testkit/dockerbuild/, which are read at runtime via importlib.resources and
# Path(__file__).parent respectively, so they must be real files in the installed tree.
[tool.hatch.build.targets.wheel]
packages = ["nbkp"]

# Hatchling's sdist default is "every file not ignored by the VCS", which would ship
# tests/, docs/, demo/, marketing/, build-scripts/, .github/ and the lockfiles. Poetry
# shipped the package plus README/LICENSE/pyproject.toml; this keeps that shape.
[tool.hatch.build.targets.sdist]
only-include = ["nbkp"]

[tool.hatch.build]
# .gitignore is the only ignore file hatchling reads — not .git/info/exclude, not
# core.excludesfile. .gitignore now covers .DS_Store, so this is a guard that keeps the
# published artifact independent of ignore-file hygiene rather than the primary fix.
exclude = [".DS_Store"]

[tool.uv]
# Replaces the default [{ file = "pyproject.toml" }] rather than extending it, hence the
# explicit file entry. The git entry is what keeps `nbkp --version` honest: nbkp reads its
# version through importlib.metadata, which an editable install freezes into .dist-info at
# install time, so without this a new commit or tag leaves a stale version in place.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

# uv.lock does not resolve PEP 517 build dependencies — `uv build` resolves them fresh from
# PyPI on a cold cache — so these constraints are the only pin on the build backend, and
# on dunamai in particular, which is what computes the version. uv.lock does record the
# constraints themselves in its [manifest], so changing one needs a `uv lock`; on Renovate
# branches the renovate-mise-lock workflow runs it. Regenerate with:
#   printf '%s\n' hatchling uv-dynamic-versioning \
#     | uv pip compile - --no-annotate --no-header --quiet
# [build-system].requires is left unpinned so the two can never contradict each other.
build-constraint-dependencies = [
  "dunamai==1.26.3",
  "hatchling==1.33.0",
  "jinja2==3.1.6",
  "markupsafe==3.0.4",
  "packaging==26.3",
  "pathspec==1.1.1",
  "pluggy==1.7.0",
  "tomlkit==0.15.2",
  "trove-classifiers==2026.9.21.13",
  "uv-dynamic-versioning==0.14.1",
]

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
# TID255: a `lazy` import that module-level code uses right away (a global, a base
# class, a decorator argument) is reified at import time anyway, so `lazy` silently
# does nothing. That nbkp.cli stays free of the heavy imports is asserted by
# tests/test_startup_imports.py; this catches the per-statement mistake.
#
# TID251: tests inject fakes through parameters instead of patching (docs/guidelines.md,
# Testing). unittest.mock is banned, and so is pytest.MonkeyPatch: tests/conftest.py
# replaces the monkeypatch fixture with one that fails, so the class is the only way
# left to patch. Each documented exception carries `# noqa: TID251` on its import, and RUF100
# reports a noqa that is no longer needed.
extend-select = ["RUF100", "TID251", "TID255"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock".msg = "Inject a fake through a parameter instead of patching (docs/guidelines.md, Testing)."
"pytest.MonkeyPatch".msg = "Inject a fake through a parameter instead of patching (docs/guidelines.md, Testing)."

[tool.ruff.lint.isort]
# Keep aliased re-imports in the same `from x import (a, b as c)` block instead of
# emitting a duplicate import statement per alias.
combine-as-imports = true

[tool.pytest.ini_options]
markers = [
  "e2e_docker: End-to-end tests requiring Docker",
  "integration_docker: Component integration tests requiring Docker",
  "integration_fs: Component integration tests using local filesystem",
]

[tool.pyright]
pythonVersion = "3.15"
# uv creates the project venv at .venv; restating it here is what lets editors and
# language servers resolve imports against it, since they inherit no shell activation.
venvPath = "."
venv = ".venv"

# Module layering rules, enforced by `mise run boundaries-check` (part of `check`).
# The rationale for each rule is in docs/architecture.md#layering.
[tool.importlinter]
root_package = "nbkp"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core modules do not depend on presentation, CLI frameworks or command wiring"
type = "forbidden"
# Enumerated: a new core package belongs on this list (and in the layers
# contract below).
source_modules = [
  "nbkp.config",
  "nbkp.credentials",
  "nbkp.disks",
  "nbkp.fsprotocol",
  "nbkp.ordering",
  "nbkp.policy",
  "nbkp.preflight",
  "nbkp.remote",
  "nbkp.run",
  "nbkp.sh",
  "nbkp.snapshots",
  "nbkp.sync",
]
forbidden_modules = [
  "rich",
  "typer",
  "nbkp.clidisplay",
  "nbkp.cliwiring",
  "nbkp.cli",
  "nbkp.*.cli",
]
ignore_imports = [
  # Each module's cli/ sub-app sits above the core.
  "nbkp.*.cli.** -> **",
  "nbkp.*.cli -> **",
  # Output (rendering) modules may use Rich and the shared presentation
  # helpers, but not Typer, the command wiring or the CLI. That core code
  # does not import its output modules (and so never loads Rich) is checked
  # by tests/test_core_imports.py: an ignored edge cannot be checked here.
  "nbkp.**.output.** -> rich",
  "nbkp.**.output -> rich",
  "nbkp.**.output.** -> nbkp.clidisplay",
  "nbkp.**.output.** -> nbkp.clidisplay.**",
  "nbkp.**.output -> nbkp.clidisplay",
  # Test and demo fixtures, not runtime code.
  "nbkp.**.testkit.** -> **",
  "nbkp.**.testkit -> **",
]

[[tool.importlinter.contracts]]
name = "CLI sub-apps do not import each other (shared wiring lives in nbkp.cliwiring)"
type = "independence"
modules = [
  "nbkp.config.cli",
  "nbkp.credentials.cli",
  "nbkp.demo.cli",
  "nbkp.disks.cli",
  "nbkp.ordering.cli",
  "nbkp.preflight.cli",
  "nbkp.run.cli",
  "nbkp.sh.cli",
  "nbkp.snapshots.cli",
]

[[tool.importlinter.contracts]]
name = "Command wiring sits below the CLI sub-apps"
type = "forbidden"
source_modules = ["nbkp.cliwiring"]
forbidden_modules = ["nbkp.cli", "nbkp.*.cli"]

[[tool.importlinter.contracts]]
name = "Core packages are layered (config at the base)"
type = "layers"
# Highest first: a package may import the layers below it, never one above.
# `|` separates siblings that must not import each other either.
# A new core package belongs in one of these layers, and on the source list
# of the first contract.
layers = [
  "nbkp.demo",
  "nbkp.run | nbkp.sh",
  "nbkp.sync",
  "nbkp.snapshots",
  "nbkp.preflight",
  "nbkp.disks",
  "nbkp.credentials | nbkp.ordering",
  "nbkp.remote",
  "nbkp.policy | nbkp.fsprotocol",
  "nbkp.config",
]
ignore_imports = [
  # Each module's cli/ sub-app sits above every core package; its imports
  # are checked by the CLI contracts instead.
  "nbkp.*.cli.** -> **",
  "nbkp.*.cli -> **",
  # Test and demo fixtures, not runtime code.
  "nbkp.**.testkit.** -> **",
  "nbkp.**.testkit -> **",
]

[[tool.importlinter.contracts]]
name = "clidisplay is a presentation leaf"
type = "forbidden"
source_modules = ["nbkp.clidisplay"]
# Every nbkp package except policy: a new package belongs on this list.
forbidden_modules = [
  "nbkp.cli",
  "nbkp.cliwiring",
  "nbkp.config",
  "nbkp.credentials",
  "nbkp.demo",
  "nbkp.disks",
  "nbkp.fsprotocol",
  "nbkp.ordering",
  "nbkp.preflight",
  "nbkp.remote",
  "nbkp.run",
  "nbkp.sh",
  "nbkp.snapshots",
  "nbkp.sync",
]

# Unused code, enforced by `mise run dead-code-check` (part of `check`). Each entry is code
# that runs without being named in the project, so the scan cannot see it used.
[tool.deadcode]
ignore-names-if-decorated-with = [
  "@*.command", "@*.callback",                # Typer registers commands by decorator
  "@pytest.fixture",                          # pytest injects fixtures by parameter name
  "@field_validator", "@model_validator",     # Pydantic calls them while validating
  "@field_serializer",                        # and while serializing
]
ignore-names = [
  "main",                                     # the [project.scripts] entry point
  "model_config",                             # read by Pydantic
  "pytestmark", "pytest_plugins", "pytest_*", # read by pytest
  "side_effect",                              # MagicMock's, set on the documented Connection patch
]
